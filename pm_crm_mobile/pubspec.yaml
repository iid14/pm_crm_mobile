name: pm_crm_mobile
description: "Мобильная CRM дистрибьютора PM International (контакты, воронка, статистика, помощник)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Локальная БД SQLite
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  # Импорт CSV из Telegram
  file_picker: ^8.0.3
  # Открытие ссылок
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
