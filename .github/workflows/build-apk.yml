name: Build APK (PM CRM Mobile)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pm_crm_mobile/**', '.github/workflows/build-apk.yml']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: pm_crm_mobile
        run: flutter create --platforms=android --org com.pmint.crm --project-name pm_crm_mobile .

      - name: Fix Android SDK requirements (compileSdk 36)
        working-directory: pm_crm_mobile
        run: |
          sed -i 's/flutter\.compileSdkVersion/36/' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "---- compileSdk в app:" && grep -n "compileSdk" android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          echo "---- gradle.properties (конец):" && tail -n 5 android/gradle.properties

      - name: Install dependencies
        working-directory: pm_crm_mobile
        run: flutter pub get

      - name: Analyze
        working-directory: pm_crm_mobile
        run: flutter analyze

      - name: Tests
        working-directory: pm_crm_mobile
        run: flutter test

      - name: Build APK (release)
        working-directory: pm_crm_mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pm-crm-apk
          path: pm_crm_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
