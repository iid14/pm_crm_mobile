name: Build APK (PM CRM Mobile)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pm_crm_mobile/**', '.github/workflows/build-apk.yml']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: pm_crm_mobile
        run: flutter create --platforms=android --org com.pmint.crm --project-name pm_crm_mobile .

      - name: Install dependencies
        working-directory: pm_crm_mobile
        run: flutter pub get

      - name: Fix compileSdk 36 (приложение + плагины)
        working-directory: pm_crm_mobile
        run: |
          sed -i 's/flutter\.compileSdkVersion/36/' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          PUB="$HOME/.pub-cache/hosted/pub.dev"
          if [ -d "$PUB" ]; then
            grep -rl "flutter.compileSdkVersion" "$PUB" --include=build.gradle --include=build.gradle.kts 2>/dev/null | xargs -r sed -i 's/flutter\.compileSdkVersion/36/' || true
            find "$PUB" -path "*/android/*" \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | xargs -r sed -i -E '/^[[:space:]]*compileSdk(Version)?/ s/3[0-9]/36/' || true
          fi
          echo "---- app:" && grep -n "compileSdk" android/app/build.gradle.kts || true
          echo "---- patched plugins:" && grep -rl "compileSdk" "$PUB" --include=build.gradle --include=build.gradle.kts 2>/dev/null | grep -i file_picker | head -n 3 || true

      - name: Analyze
        working-directory: pm_crm_mobile
        run: flutter analyze

      - name: Tests
        working-directory: pm_crm_mobile
        run: flutter test

      - name: Build APK (release)
        working-directory: pm_crm_mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pm-crm-apk
          path: pm_crm_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
